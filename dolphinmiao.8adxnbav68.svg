<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 84" role="img" aria-label="&#x7EFF;&#x8681;&#x65B0;&#x9185;&#x9152;&#xFF0C;&#x7EA2;&#x6CE5;&#x5C0F;&#x706B;&#x7089;&#x3002;&#x665A;&#x6765;&#x5929;&#x6B32;&#x96EA;&#xFF0C;&#x80FD;&#x996E;&#x4E00;&#x676F;&#x65E0;&#xFF1F;LINUX DO lvsedd">
  <style>
    @keyframes lvInkIn{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:translateY(0)}}
    @keyframes lvLineDraw{0%{stroke-dashoffset:520;opacity:0}20%{stroke-dashoffset:0;opacity:.44}80%{stroke-dashoffset:0;opacity:.34}100%{stroke-dashoffset:520;opacity:0}}
    @keyframes lvLineDrawLate{0%{stroke-dashoffset:520;opacity:0}20%{stroke-dashoffset:0;opacity:.34}80%{stroke-dashoffset:0;opacity:.28}100%{stroke-dashoffset:520;opacity:0}}
    @keyframes lvSweep{0%{transform:translateX(-160px);opacity:0}20%{opacity:.15}75%{opacity:.08}100%{transform:translateX(820px);opacity:0}}
    @keyframes lvPaperTurn{0%,23%{opacity:0;transform:translateX(-74px) scaleX(.72)}28%{opacity:.4;transform:translateX(0) scaleX(1)}36%{opacity:.18;transform:translateX(68px) scaleX(.84)}42%,73%{opacity:0;transform:translateX(118px) scaleX(.72)}78%{opacity:.4;transform:translateX(0) scaleX(1)}86%{opacity:.18;transform:translateX(68px) scaleX(.84)}92%,100%{opacity:0;transform:translateX(118px) scaleX(.72)}}
    @keyframes lvFirstText{0%{visibility:visible;opacity:0;filter:blur(2.4px);transform:translateY(1px)}10%,40%{visibility:visible;opacity:1;filter:blur(0);transform:translateY(0)}48%{visibility:visible;opacity:0;filter:blur(2.4px);transform:translateY(-1px)}49%,100%{visibility:hidden;opacity:0;filter:blur(2.4px);transform:translateY(-1px)}}
    @keyframes lvSecondText{0%,47%{visibility:hidden;opacity:0;filter:blur(2.4px);transform:translateY(1px)}48%{visibility:visible;opacity:0;filter:blur(2.4px);transform:translateY(1px)}56%,84%{visibility:visible;opacity:1;filter:blur(0);transform:translateY(0)}100%{visibility:visible;opacity:0;filter:blur(2px);transform:translateY(1px)}}
    .lv-bg{fill:#eef3e8}
    .lv-soft{opacity:.7}
    .lv-sweep{animation:lvSweep 9.5s ease-in-out infinite}
    .lv-turn{animation:lvPaperTurn 8.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .lv-rule{fill:none;stroke:#3d7a5f;stroke-width:1;stroke-linecap:round;stroke-dasharray:520;stroke-dashoffset:520;animation:lvLineDraw 8.8s linear infinite both}
    .lv-rule2{stroke:#9b7a4a;stroke-width:.75;animation-name:lvLineDrawLate;opacity:.5}
    .lv-line{font-size:22px;letter-spacing:1.3px;fill:#2a3327;paint-order:stroke fill;stroke:#eef3e8;stroke-width:.9;transform-box:fill-box;transform-origin:center;font-family:serif}
    .lv-line-one{animation:lvFirstText 8.8s ease-in-out infinite}
    .lv-line-two{visibility:hidden;opacity:0;animation:lvSecondText 8.8s ease-in-out infinite}
    .lv-brand{font-family:sans-serif;font-size:8.4px;letter-spacing:1.35px;fill:#6b7e68;animation:lvInkIn 1.1s ease .55s both}
    .lv-brand-rule{fill:none;stroke:#a8b89e;stroke-width:.75;stroke-linecap:round;opacity:.75;animation:lvInkIn 1.1s ease .55s both}
    .lv-frame{fill:none;stroke:#b8ccad;stroke-width:1}
    .lv-frame-accent{fill:none;stroke:#3d7a5f;stroke-width:1.15;stroke-linecap:round;stroke-dasharray:46 584;opacity:.65}
